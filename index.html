<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 플래시카드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 relative">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 rounded-2xl shadow-lg mb-2">
            <i class="fa-solid fa-layer-group text-xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">AI 스마트 플래시카드</h1>
        <p class="text-xs text-slate-400 mt-1">사진에서 단어를 추출하고 나만의 단어장 만들기</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col gap-4 pb-6">
        
        <!-- Upload Section -->
        <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 shadow-xl">
            <h2 class="text-sm font-semibold flex items-center gap-2 mb-2 text-indigo-400">
                <i class="fa-solid fa-camera"></i> 사진으로 카드 만들기
            </h2>
            <p class="text-xs text-slate-400 mb-4">카메라로 직접 찍거나 갤러리 사진을 선택해 보세요.</p>
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-600 text-center font-medium transition flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-camera text-indigo-400"></i>
                    <span>카메라 촬영</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event)">
                </label>
                <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-2.5 px-3 rounded-xl border border-slate-600 text-center font-medium transition flex items-center justify-center gap-1.5">
                    <i class="fa-regular fa-images text-indigo-400"></i>
                    <span>갤러리 선택</span>
                    <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </label>
            </div>

            <div class="flex items-center justify-between bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50">
                <span id="fileNameText" class="text-xs text-slate-400 truncate max-w-[180px] pl-1">
                    선택된 사진 없음
                </span>
                <button onclick="convertImageToCards()" id="convertBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-4 rounded-lg shadow-md transition flex items-center gap-1.5 disabled:opacity-50">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 카드 변환
                </button>
            </div>
        </div>

        <!-- Flashcard Viewport -->
        <div id="flashcardSection" class="hidden flex-1 flex flex-col gap-4">
            
            <!-- Controls Bar -->
            <div class="flex flex-col gap-2 px-1">
                <div class="flex items-center justify-between">
                    <span id="cardCounter" class="text-xs font-semibold text-slate-400">1 / 1</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="toggleReverseMode()" id="reverseModeBtn" class="text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition">
                            <i class="fa-solid fa-rotate mr-1"></i> 반대로
                        </button>
                        <button onclick="shuffleCards()" class="text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition">
                            <i class="fa-solid fa-shuffle mr-1"></i> 섞기
                        </button>
                        <button onclick="resetToStart()" class="text-[11px] bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2.5 py-1.5 rounded-lg text-slate-300 transition">
                            <i class="fa-solid fa-rotate-left mr-1"></i> 처음
                        </button>
                    </div>
                </div>
                <!-- 🌟 모르는 단어 모아보기 필터 버튼 -->
                <div class="flex items-center justify-between bg-slate-800/80 p-2 rounded-xl border border-slate-700">
                    <span id="starredCountText" class="text-xs text-amber-400 font-medium pl-1">체크한 단어: 0개</span>
                    <button onclick="toggleStarredFilter()" id="starredFilterBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition font-medium border border-slate-600">
                        <i class="fa-regular fa-star mr-1 text-amber-400"></i> 체크한 단어만 학습하기
                    </button>
                </div>
            </div>

            <!-- Card 3D Container -->
            <div class="relative w-full aspect-[4/3] perspective-1000 cursor-pointer" onclick="flipCard()">
                <div id="cardInner" class="w-full h-full relative transition-transform duration-500 transform-style-3d rounded-3xl shadow-2xl">
                    
                    <!-- 앞면 (Front) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col items-center justify-center text-center backface-hidden shadow-inner">
                        <span class="absolute top-4 left-4 text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md" id="frontBadge">FRONT</span>
                        <div id="frontContent" class="text-6xl font-black tracking-tight text-white px-4 leading-none">
                            단어
                        </div>
                        <span class="absolute bottom-4 text-xs text-slate-500"><i class="fa-solid fa-hand-pointer mr-1"></i> 터치해서 뒤집기</span>
                    </div>

                    <!-- 뒷면 (Back) -->
                    <div class="absolute inset-0 w-full h-full bg-indigo-950 border border-indigo-800/60 rounded-3xl p-6 flex flex-col items-center justify-center text-center backface-hidden rotate-y-180 shadow-inner">
                        <span class="absolute top-4 left-4 text-[10px] font-bold uppercase tracking-wider text-indigo-300 bg-indigo-500/20 px-2.5 py-1 rounded-md" id="backBadge">BACK</span>
                        <div id="backContent" class="text-3xl font-bold text-indigo-100 px-4">
                            뜻
                        </div>
                        <span class="absolute bottom-4 text-xs text-indigo-400/60"><i class="fa-solid fa-hand-pointer mr-1"></i> 터치해서 앞면으로</span>
                    </div>

                </div>
            </div>

            <!-- 🌟 단어 체크(별표) 버튼 & 네비게이션 버튼 -->
            <div class="flex flex-col gap-2">
                <button onclick="toggleCurrentCardStar()" id="starBtn" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2.5 rounded-xl font-medium text-xs text-slate-300 transition shadow-sm flex items-center justify-center gap-2">
                    <i id="starIcon" class="fa-regular fa-star text-amber-400 text-sm"></i>
                    <span id="starBtnText">모르는 단어로 체크하기</span>
                </button>

                <div class="flex items-center gap-3">
                    <button onclick="navigateCard(-1)" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-2xl font-semibold text-sm transition shadow-md">
                        <i class="fa-solid fa-arrow-left mr-2"></i> 이전 카드
                    </button>
                    <button onclick="navigateCard(1)" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-2xl font-semibold text-sm transition shadow-md">
                        다음 카드 <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Empty / Guide State -->
        <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-800 rounded-3xl">
            <i class="fa-solid fa-book-open text-4xl text-slate-700 mb-3"></i>
            <p class="text-sm text-slate-400 font-medium">등록된 카드가 없습니다.</p>
            <p class="text-xs text-slate-500 mt-1">상단에서 사진을 촬영하거나 선택하고 AI 변환을 눌러보세요.</p>
        </div>

    </main>

    <!-- 로딩 중 표시 모달 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-2xl flex flex-col items-center max-w-xs text-center">
            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-base font-bold text-white mb-1">변환 중입니다</p>
            <p class="text-xs text-slate-400">AI가 사진을 분석하고 있습니다.<br>잠시만 기다려 주세요...</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-200 px-4 py-2.5 rounded-xl shadow-2xl border border-slate-700 text-xs font-medium transition-all duration-300 opacity-0 pointer-events-none z-50">
        알림 메시지
    </div>

    <!-- Script Logic -->
    <script>
        let cardsData = []; // 모든 카드 원본 데이터 ({ word, meaning, isStarred })
        let filteredIndices = []; // 현재 화면에 보여줄 카드들의 원본 인덱스 배열
        let currentIndex = 0;
        let isFlipped = false;
        let isReversed = false;
        let isStarredOnlyMode = false;
        let selectedImageBase64 = null;
        let selectedMimeType = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileNameText').innerText = file.name;
            selectedMimeType = file.type || 'image/jpeg';

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result.split(',')[1];
                selectedImageBase64 = base64String;
                showToast('사진 준비 완료! AI 카드 변환을 눌러주세요.');
            };
            reader.readAsDataURL(file);
        }

        async function convertImageToCards() {
            if (!selectedImageBase64) {
                showToast('먼저 사진을 촬영하거나 파일로 선택해주세요.');
                return;
            }

            const btn = document.getElementById('convertBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');

            btn.disabled = true;
            loadingOverlay.classList.remove('hidden');

            try {
                const response = await fetch('/api/analyze-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageBase64: selectedImageBase64,
                        mimeType: selectedMimeType
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `서버 오류 (${response.status})`);
                }

                const result = await response.json();
                if (!Array.isArray(result) || result.length === 0) {
                    throw new Error('인식된 단어가 없습니다. 다른 사진으로 시도해 주세요.');
                }

                // 각 카드에 즐겨찾기(isStarred) 속성 추가
                cardsData = result.map(card => ({ ...card, isStarred: false }));
                isStarredOnlyMode = false;
                filteredIndices = cardsData.map((_, i) => i);
                currentIndex = 0;
                initFlashcards();
                showToast(`${cardsData.length}개의 단어 카드가 생성되었습니다!`);
            } catch (err) {
                console.error(err);
                showToast(err.message || '사진 분석 중 오류가 발생했습니다.');
            } finally {
                btn.disabled = false;
                loadingOverlay.classList.add('hidden');
            }
        }

        function initFlashcards() {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('flashcardSection').classList.remove('hidden');
            updateStarredCount();
            renderCurrentCard();
        }

        function renderCurrentCard() {
            if (filteredIndices.length === 0) {
                if (isStarredOnlyMode) {
                    showToast('체크한 단어가 없습니다. 전체 보기로 돌아갑니다.');
                    isStarredOnlyMode = false;
                    filteredIndices = cardsData.map((_, i) => i);
                    currentIndex = 0;
                    updateStarredFilterButtonUI();
                } else {
                    return;
                }
            }

            if (currentIndex >= filteredIndices.length) {
                currentIndex = 0;
            }

            const originalIdx = filteredIndices[currentIndex];
            const card = cardsData[originalIdx];
            
            document.getElementById('cardCounter').innerText = `${currentIndex + 1} / ${filteredIndices.length}`;

            const frontEl = document.getElementById('frontContent');
            const backEl = document.getElementById('backContent');

            const wordText = card.word || '';
            const meaningText = card.meaning || '';

            if (!isReversed) {
                document.getElementById('frontBadge').innerText = "FRONT (단어/한자)";
                document.getElementById('backBadge').innerText = "BACK (뜻)";
                frontEl.innerHTML = `<div class="text-6xl font-black text-white leading-none">${wordText}</div>`;
                backEl.innerHTML = `<div class="text-3xl font-bold text-white">${meaningText}</div>`;
            } else {
                document.getElementById('frontBadge').innerText = "FRONT (뜻)";
                document.getElementById('backBadge').innerText = "BACK (단어/한자)";
                frontEl.innerHTML = `<div class="text-3xl font-bold text-white">${meaningText}</div>`;
                backEl.innerHTML = `<div class="text-6xl font-black text-white leading-none">${wordText}</div>`;
            }

            updateStarButtonUI(card.isStarred);
            resetFlipStateSilently();
        }

        function updateStarButtonUI(isStarred) {
            const icon = document.getElementById('starIcon');
            const text = document.getElementById('starBtnText');
            const btn = document.getElementById('starBtn');

            if (isStarred) {
                icon.className = "fa-solid fa-star text-amber-400 text-sm";
                text.innerText = "체크 해제하기";
                btn.classList.add('border-amber-500/50', 'bg-amber-500/10');
            } else {
                icon.className = "fa-regular fa-star text-amber-400 text-sm";
                text.innerText = "모르는 단어로 체크하기";
                btn.classList.remove('border-amber-500/50', 'bg-amber-500/10');
            }
        }

        function toggleCurrentCardStar() {
            if (filteredIndices.length === 0) return;
            const originalIdx = filteredIndices[currentIndex];
            cardsData[originalIdx].isStarred = !cardsData[originalIdx].isStarred;
            
            updateStarButtonUI(cardsData[originalIdx].isStarred);
            updateStarredCount();
            showToast(cardsData[originalIdx].isStarred ? '⭐ 모르는 단어로 체크했습니다.' : '체크가 해제되었습니다.');
        }

        function updateStarredCount() {
            const starredCount = cardsData.filter(c => c.isStarred).length;
            document.getElementById('starredCountText').innerText = `체크한 단어: ${starredCount}개`;
        }

        function toggleStarredFilter() {
            const starredIndices = [];
            cardsData.forEach((card, idx) => {
                if (card.isStarred) starredIndices.push(idx);
            });

            if (!isStarredOnlyMode) {
                if (starredIndices.length === 0) {
                    showToast('체크된 단어가 없습니다. 카드의 체크 버튼을 눌러주세요.');
                    return;
                }
                isStarredOnlyMode = true;
                filteredIndices = starredIndices;
                showToast('⭐ 체크한 단어만 모아서 학습합니다.');
            } else {
                isStarredOnlyMode = false;
                filteredIndices = cardsData.map((_, i) => i);
                showToast('전체 단어장으로 돌아왔습니다.');
            }

            currentIndex = 0;
            updateStarredFilterButtonUI();
            renderCurrentCard();
        }

        function updateStarredFilterButtonUI() {
            const btn = document.getElementById('starredFilterBtn');
            if (isStarredOnlyMode) {
                btn.innerHTML = `<i class="fa-solid fa-star mr-1 text-amber-400"></i> 전체 보기로 돌아가기`;
                btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
                btn.classList.remove('bg-slate-700', 'text-slate-200', 'border-slate-600');
            } else {
                btn.innerHTML = `<i class="fa-regular fa-star mr-1 text-amber-400"></i> 체크한 단어만 학습하기`;
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
                btn.classList.add('bg-slate-700', 'text-slate-200', 'border-slate-600');
            }
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const inner = document.getElementById('cardInner');
            if (isFlipped) {
                inner.classList.add('rotate-y-180');
            } else {
                inner.classList.remove('rotate-y-180');
            }
        }

        function resetFlipStateSilently() {
            isFlipped = false;
            const inner = document.getElementById('cardInner');
            inner.classList.remove('rotate-y-180');
        }

        function navigateCard(direction) {
            if (filteredIndices.length <= 1) return;
            resetFlipStateSilently();
            setTimeout(() => {
                currentIndex = (currentIndex + direction + filteredIndices.length) % filteredIndices.length;
                renderCurrentCard();
            }, 150);
        }

        function shuffleCards() {
            filteredIndices.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            resetFlipStateSilently();
            renderCurrentCard();
            showToast('카드 순서가 섞였습니다!');
        }

        function resetToStart() {
            if (!isStarredOnlyMode) {
                filteredIndices = cardsData.map((_, i) => i);
            } else {
                filteredIndices = [];
                cardsData.forEach((card, idx) => {
                    if (card.isStarred) filteredIndices.push(idx);
                });
            }
            currentIndex = 0;
            shuffleCards();
            showToast('처음부터 다시 시작합니다.');
        }

        function toggleReverseMode() {
            isReversed = !isReversed;
            renderCurrentCard();
            showToast(isReversed ? '앞면/뒷면이 반대로 전환되었습니다.' : '기본 모드로 돌아왔습니다.');
        }
    </script>
</body>
</html>
